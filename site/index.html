<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>照见 Seen — 自我探索工具</title>
  <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="cursor-glow" id="cursorGlow"></div>
  <nav class="nav" id="nav">
    <a href="#" class="nav-brand">照见 <span>Seen</span></a>
    <div class="nav-links">
      <a href="#scales" class="nav-link">量表测评</a>
      <a href="#cards" class="nav-link">情绪卡片</a>
      <a href="#about" class="nav-link">关于</a>
      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="cn">简</button>
        <button class="lang-btn" data-lang="tw">繁</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>
  </nav>

  <section id="hero" class="hero">
    <div class="hero-content">
      <div class="hero-eyebrow" data-i18n="hero.title"></div>
      <h1 data-i18n="hero.title">Name what is here.</h1>
      <div class="hero-subtitle" data-i18n="hero.sub">Choose one gentle next step.</div>
      <div class="hero-desc" data-i18n="hero.desc">A structured self-reflection tool for moments when a feeling is real, but its name is hard to find.</div>
      <div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;">
        <a href="#scales" class="btn btn-primary" data-i18n="scales.nav">量表测评</a>
        <a href="#cards" class="btn btn-secondary" data-i18n="cards.nav">情绪卡片</a>
      </div>
    </div>
  </section>

  <section id="scales" style="display:none;padding-top:120px;">
    <div class="container">
      <div class="section-header"><h2 data-i18n="scales.title">选择一种测评</h2><div class="accent-line"></div></div>
      <div class="subtitle" data-i18n="scales.subtitle">找到适合你的量表，开始探索自己</div>
      <input type="text" id="scaleSearch" placeholder="搜索量表..." data-i18n-placeholder="scales.search" style="padding:12px 16px;border:1px solid var(--border);border-radius:10px;background:var(--bg-card);color:var(--text-primary);width:100%;max-width:400px;margin-bottom:24px;font-size:16px;">
      <div id="scalesGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;"></div>
    </div>
  </section>

  <section id="assessment" style="display:none;padding-top:120px;">
    <div class="container">
      <div style="max-width:600px;margin:0 auto;">
        <div id="progressBar" style="height:4px;background:var(--border);border-radius:2px;margin-bottom:32px;overflow:hidden;">
          <div id="progressFill" style="height:100%;background:var(--accent);width:0%;transition:width .3s;"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-bottom:16px;">
          <span id="progressText" style="color:var(--text-muted);font-size:14px;"></span>
          <span id="totalText" style="color:var(--text-muted);font-size:14px;"></span>
        </div>
        <div id="questionText" style="font-size:20px;margin-bottom:32px;color:var(--text-primary);line-height:1.8;"></div>
        <div id="scaleOptions" style="display:flex;flex-direction:column;gap:12px;"></div>
        <div style="display:flex;gap:12px;margin-top:24px;justify-content:center;">
          <button id="btnBack" class="btn btn-secondary" data-i18n="assessment.back">返回</button>
          <button id="btnSkip" class="btn btn-secondary" data-i18n="assessment.skip">跳过</button>
          <button id="btnNext" class="btn btn-primary" data-i18n="assessment.next">下一题</button>
        </div>
      </div>
    </div>
  </section>

  <section id="results" style="display:none;padding-top:120px;">
    <div class="container">
      <div id="resultsContainer"></div>
    </div>
  </section>

  <section id="cards" class="cards-page" style="display:none;padding-top:120px;">
    <div class="container">
      <div class="section-header"><h2 data-i18n="cards.title">情绪命名地图</h2><div class="accent-line"></div></div>
      <div class="subtitle" data-i18n="cards.subtitle">36 张卡片 · 探索你的感受</div>
      <input type="text" id="cardSearch" placeholder="搜索情绪..." data-i18n-placeholder="cards.search" style="padding:12px 16px;border:1px solid var(--border);border-radius:10px;background:var(--bg-card);color:var(--text-primary);width:100%;max-width:400px;margin-bottom:24px;font-size:16px;">
      <div style="display:flex;gap:12px;margin-bottom:24px;justify-content:center;">
        <button id="randomCard" class="btn btn-secondary" data-i18n="cards.random">随机一张</button>
      </div>
      <div id="cardsGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;"></div>
    </div>
  </section>

  <section id="about" style="display:none;padding-top:120px;">
    <div class="container" style="text-align:center;">
      <h2 data-i18n="about.title">关于照见</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px;margin-top:32px;">
        <div class="card"><h3 data-i18n="about.feature1">10 套专业量表</h3></div>
        <div class="card"><h3 data-i18n="about.feature2">36 张情绪卡片</h3></div>
        <div class="card"><h3 data-i18n="about.feature3">智能结果推荐</h3></div>
        <div class="card"><h3 data-i18n="about.feature4">隐私至上</h3></div>
      </div>
    </div>
  </section>

  <script src="/data.js"></script>
  <script src="/app.js"></script>
</body>
</html>
